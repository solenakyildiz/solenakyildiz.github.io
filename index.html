<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e8; --card:#fffdf9; --ink:#1c2b26; --muted:#7a7f78; --line:#ece3d3;
  --green:#111111; --green-2:#2e2e2e; --gold:#c29a45; --gold-2:#e6c77d; --gold-soft:#f6ecd4;
  --rose:#e9cfc4; --ok:#2a8a5c; --danger:#b03c33;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;color:#fff;text-align:center;padding:34px 16px 64px;
  background:radial-gradient(120% 90% at 50% 0%,#2a2a2a 0%,#111 55%,#050505 100%)}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:var(--bg);border-radius:50% 50% 0 0}
.sparkle{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold-2);opacity:0;
  box-shadow:0 0 10px 2px rgba(230,199,125,.7);animation:twinkle 4s var(--ease) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}
.star{width:46px;height:46px;margin:0 auto 6px;animation:spin 18s linear infinite;filter:drop-shadow(0 0 10px rgba(230,199,125,.45))}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-family:var(--serif);font-weight:600;font-size:34px;letter-spacing:.08em;line-height:1.05;
  background:linear-gradient(90deg,#fff 0%,#f7e3ad 40%,#fff 60%,#f7e3ad 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.academy{font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:var(--gold-2);margin-top:6px}
.logo{display:block;width:min(300px,78vw);height:auto;margin:0 auto;position:relative;z-index:1;
  opacity:0;animation:logoIn 1.1s var(--ease) forwards,glow 5s 1.2s ease-in-out infinite}
@keyframes logoIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(230,199,125,0))}50%{filter:drop-shadow(0 0 14px rgba(230,199,125,.35))}}
.tagline{font-family:var(--serif);font-style:italic;font-size:19px;color:#e9e2d3;margin-top:14px;opacity:0;animation:rise .9s .3s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- LAYOUT ---------- */
main{position:relative;z-index:2;max-width:720px;margin:-38px auto 0;padding:0 16px 20px}
.progress{background:var(--card);border-radius:18px;padding:14px 16px 12px;box-shadow:0 8px 30px rgba(0,0,0,.10);margin-bottom:14px}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:4px;transition:width .6s var(--ease)}
.labels{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted);letter-spacing:.02em}
.labels span{transition:color .3s}
.labels span.on{color:var(--green);font-weight:600}

.card{background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.panel{animation:panelIn .55s var(--ease) both}
.panel.back{animation-name:panelBack}
@keyframes panelIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes panelBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
h2{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15;margin:0 0 4px;color:var(--green)}
.hint{color:var(--muted);font-size:14px;margin:0 0 16px}

/* categories */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:40px;padding:9px 15px;font-size:14px;cursor:pointer;transition:all .3s var(--ease)}
.cat svg{width:16px;height:16px}
.cat.sel{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)}

.list{display:grid;gap:10px}
@media(min-width:560px){.list.two{grid-template-columns:1fr 1fr}}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-height:64px;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;
  animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.opt:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.10);border-color:var(--gold-2)}
.opt:active{transform:scale(.98)}
.opt::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-120%);transition:transform .8s var(--ease)}
.opt:hover::after{transform:translateX(120%)}
.opt.sel{border-color:var(--green);background:linear-gradient(135deg,#f7f3ec,#fff);box-shadow:0 0 0 2px var(--green) inset,0 10px 22px rgba(0,0,0,.12)}
.ico{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:#9b7426}
.ico svg{width:22px;height:22px}
.opt .t{flex:1;min-width:0}
.opt .name{font-weight:500;display:block}
.opt .dur{font-size:13px;color:var(--muted)}
.check{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:all .3s var(--ease)}
.check svg{width:14px;height:14px;stroke:#fff;opacity:0;transform:scale(.3);transition:all .3s var(--ease)}
.opt.sel .check{background:var(--green);border-color:var(--green)}
.opt.sel .check svg{opacity:1;transform:none}

.avatar{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:21px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 12px rgba(0,0,0,.12)}
.badge{display:inline-block;font-size:11px;font-weight:600;background:var(--gold-soft);color:#8a661d;border-radius:20px;padding:2px 9px;margin-left:6px;vertical-align:2px}

/* dates & times */
.days{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 14px;margin:0 -2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;scroll-snap-align:start;text-align:center;border:1px solid var(--line);border-radius:18px;padding:10px 0;background:#fff;cursor:pointer;transition:all .3s var(--ease)}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{display:block;font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.day:hover:not(:disabled){border-color:var(--gold-2);transform:translateY(-2px)}
.day.sel{background:linear-gradient(160deg,var(--green-2),var(--green));border-color:var(--green);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.28);transform:translateY(-3px)}
.day.sel small{color:var(--gold-2)}
.day:disabled{opacity:.35;cursor:not-allowed;background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f4efe6 6px,#f4efe6 12px)}
.period{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:14px 0 8px}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.time{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 0;font-weight:500;cursor:pointer;
  transition:all .25s var(--ease);animation:pop .4s var(--ease) both;animation-delay:calc(var(--i,0) * 18ms)}
.time:hover{border-color:var(--gold-2);transform:translateY(-1px)}
.time.sel{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}

/* form */
.summary{display:grid;gap:8px;background:linear-gradient(135deg,var(--gold-soft),#fbf6ea);border-radius:16px;padding:14px 16px;margin-bottom:6px}
.summary div{display:flex;gap:10px;align-items:center;font-size:15px}
.summary svg{width:18px;height:18px;flex:0 0 18px;color:#9b7426}
.field{position:relative;margin-top:16px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:22px 14px 8px;background:#fff;font:inherit;color:inherit;transition:border-color .25s,box-shadow .25s;resize:none}
.field label{position:absolute;left:15px;top:15px;color:var(--muted);font-size:15px;pointer-events:none;transition:all .2s var(--ease)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(0,0,0,.08)}
.field input:focus+label,.field input:not(:placeholder-shown)+label,
.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{top:6px;font-size:11px;color:var(--green);letter-spacing:.04em}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* bottom bar */
.bar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:16px 0 calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,rgba(247,241,232,0))}
.btn{border:0;border-radius:16px;padding:17px 18px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s,opacity .3s}
.btn:active{transform:scale(.97)}
.btn.main{flex:1;color:#fff;background:linear-gradient(135deg,var(--green-2),var(--green));box-shadow:0 10px 24px rgba(0,0,0,.28);position:relative;overflow:hidden}
.btn.main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);animation:sweep 3.2s 1s infinite}
@keyframes sweep{0%{left:-60%}35%,100%{left:130%}}
.btn.main:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.main:disabled::after{display:none}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}

/* success */
.done{text-align:center;padding:30px 18px 26px;position:relative;overflow:hidden}
.ring{width:96px;height:96px;margin:0 auto 14px}
.ring circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .8s var(--ease) forwards;transform:rotate(-90deg);transform-origin:center}
.ring path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .7s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ticket{margin:16px auto 0;max-width:360px;border:1px dashed var(--gold);border-radius:16px;padding:14px;background:#fffaf0;text-align:left}
.ticket div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px}
.ticket span{color:var(--muted)}
.wa{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:#25d366;color:#fff;text-decoration:none;border-radius:14px;padding:14px 20px;font-weight:600;box-shadow:0 8px 18px rgba(37,211,102,.3)}
.wa svg{width:20px;height:20px}
.confetti{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;opacity:0;animation:fall 2.6s var(--ease) forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(540deg)}}

.demo[hidden]{display:none}
.demo{display:flex;gap:8px;align-items:flex-start;background:#fff8e4;border:1px dashed var(--gold);color:#6b5419;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:14px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:6px 16px 34px;line-height:1.8}
footer a{color:var(--green-2);text-decoration:none;font-weight:500}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hero" id="hero">
  <img class="logo" src="logo.png" alt="Şölen Akyıldız Beauty Academy">

</header>

<main>
  <div class="demo" id="demo" hidden>✦ <span>Deneme sürümü: randevular henüz salona iletilmiyor, görünüm ve akış test ediliyor.</span></div>

    <div class="track"><div class="fill" id="fill"></div></div>

  </div>

</main>

<footer>

  Çar–Cmt 09:00–19:00 · Pazar 10:00–18:00 · Pzt–Salı kapalı
</footer>

<script>
/* ====== SALON AYARLARI ====== */
const API = "https://script.google.com/macros/s/AKfycbzG_pydndUnBHnWpFK1LN_19Jz2cYRRLAfLkcOFs5yorPZwl3pGc2QsNADbAdd9VQCxmQ/exec"; // Google Apps Script web uygulaması adresi (boşsa deneme modu)
const CONFIG = {
  whatsapp: "905303449170",
  slotStep: 15,
  daysAhead: 30,
  hours: {0:["10:00","18:00"],1:null,2:null,3:["09:00","19:00"],4:["09:00","19:00"],5:["09:00","19:00"],6:["09:00","19:00"]},
  staff: ["Şölen","Ceren","Sude","Ayaz","Gizem","Selin","Nazlı","Sudenaz","İlkbal","Yasemin","Eda"],
  services: [
    {cat:"Cilt", name:"Hydrafacial", min:90},
    {cat:"Cilt", name:"Mikronee", min:30},
    {cat:"Cilt", name:"İğnesiz Mezoterapi", min:30},
    {cat:"Cilt", name:"Pop-Up", min:30},
    {cat:"Lazer", name:"Lazer Epilasyon", min:30},
    {cat:"Lazer", name:"Lazer Epilasyon – Tüm Vücut", min:90},
    {cat:"Lazer", name:"Tepeden Tırnağa Epilasyon", min:120},
    {cat:"Lazer", name:"Deneme Atışı", min:15},
    {cat:"Kaş & Kirpik", name:"Kirpik Lifting", min:20},
    {cat:"Kaş & Kirpik", name:"Kaş Alma", min:20},
    {cat:"Kaş & Kirpik", name:"Altın Oran Kaş Tasarımı", min:30},
    {cat:"Kaş & Kirpik", name:"Kaş Vitamini", min:10},
    {cat:"Kaş & Kirpik", name:"Kaş Laminasyonu", min:10},
    {cat:"Vücut & Masaj", name:"Masaj", min:40},
    {cat:"Vücut & Masaj", name:"Bölgesel İncelme", min:30},
    {cat:"Saç", name:"Saç Vitamini", min:30},
    {cat:"Danışma", name:"Görüşme", min:30},
    {cat:"Danışma", name:"Demo", min:20}
  ]
};
/* ============================ */

const ICONS = {
  "Cilt":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3c4 0 7 3.4 7 8.2C19 16.6 15.8 21 12 21s-7-4.4-7-9.8C5 6.4 8 3 12 3z"/><path d="M9.2 10.5h.01M14.8 10.5h.01M9.5 15c1.4 1 3.6 1 5 0"/></svg>',
  "Lazer":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/><circle cx="12" cy="12" r="2.2"/></svg>',
  "Kaş & Kirpik":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 13C6 8.5 18 8.5 21.5 13"/><path d="M5 11.3 3.6 9.2M8.4 10 7.7 7.6M12 9.6V7.1M15.6 10l.7-2.4M19 11.3l1.4-2.1"/><path d="M6 16c3.3 2.3 8.7 2.3 12 0"/></svg>',
  "Vücut & Masaj":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 21c-4.5-3-7-6.2-7-9.6A4.4 4.4 0 0 1 12 8.6a4.4 4.4 0 0 1 7 2.8c0 3.4-2.5 6.6-7 9.6z"/><path d="M12 8.6V5M9.5 3.5 12 5l2.5-1.5"/></svg>',
  "Saç":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 21c-1-5 0-11 6-16 6 5 7 11 6 16"/><path d="M9.5 21c-.5-4 .5-8 2.5-11 2 3 3 7 2.5 11"/></svg>',
  "Danışma":'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 5h16v10H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>'
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PAL = [["#c29a45","#e6c77d"],["#2e2e2e","#6b6b6b"],["#b9776a","#e3b3a5"],["#7a6a9a","#b4a6cf"],["#2f6b8a","#77a9c4"],["#a0623e","#d8a27d"]];

let BOOKED = [];
let loaded = !API, loading = null;
if(!API) document.getElementById("demo").hidden = false;
function loadBusy(){
  if(!API) return Promise.resolve();
  const t=new Date(), e=new Date(); e.setDate(t.getDate()+CONFIG.daysAhead+1);
  loading = fetch(`${API}?action=slots&from=${ymd(t)}&to=${ymd(e)}`).then(r=>r.json()).then(j=>{ if(j.ok){BOOKED=j.busy; loaded=true;} }).catch(()=>{}).finally(()=>{loading=null;});
  return loading;
}
const S = {step:0, cat:null, service:null, staff:null, date:null, time:null, name:"", phone:"", note:"", dir:1};
const DAYS = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
const DAYS_L = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const MONTHS = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const MONTHS_L = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const $ = s => document.querySelector(s);
const toMin = t => {const [h,m]=t.split(":").map(Number); return h*60+m};
const toHM = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const durTxt = m => m>=60 ? (m%60 ? `${Math.floor(m/60)} sa ${m%60} dk` : `${m/60} saat`) : `${m} dk`;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fullDate = d => `${d.getDate()} ${MONTHS_L[d.getMonth()]} ${DAYS_L[d.getDay()]}`;
const staffTxt = () => S.staff==="*" ? "Uygun uzman" : S.staff;

/* sparkles */
(()=>{const h=$("#hero");for(let i=0;i<14;i++){const s=document.createElement("span");s.className="sparkle";
  s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*85)+"%";s.style.animationDelay=(Math.random()*4)+"s";
  const z=2+Math.random()*4;s.style.width=s.style.height=z+"px";h.appendChild(s);}})();

function isFree(staff,date,start,end){return !BOOKED.some(b=>b.staff===staff&&b.date===date&&start<b.end&&end>b.start)}
function slotsFor(d){
  const h=CONFIG.hours[d.getDay()]; if(!h) return [];
  const open=toMin(h[0]),close=toMin(h[1]),dur=S.service.min,date=ymd(d);
  const now=new Date(),isToday=ymd(now)===date,nowMin=now.getHours()*60+now.getMinutes()+30;
  const pool=S.staff==="*"?CONFIG.staff:[S.staff];const out=[];
  for(let t=open;t+dur<=close;t+=CONFIG.slotStep){
    if(isToday&&t<nowMin)continue;
    if(pool.some(p=>isFree(p,date,t,t+dur)))out.push(t);
  }
  return out;
}

function go(n){S.dir = n>S.step?1:-1; S.step=n; render(true);}

function render(scroll){
  $("#fill").style.width = (Math.min(S.step,3)+1)*25+"%";
  document.querySelectorAll("#labels span").forEach((s,i)=>s.classList.toggle("on",i===Math.min(S.step,3)));
  const v=$("#view"), bar=$("#bar");
  if(scroll) window.scrollTo({top:document.querySelector(".progress").offsetTop-10,behavior:"smooth"});
  const cls = `card panel ${S.dir<0?"back":""}`;

  if(S.step===0){
    const cats=[...new Set(CONFIG.services.map(s=>s.cat))];
    if(!S.cat) S.cat = S.service ? S.service.cat : cats[0];
    const items = CONFIG.services.map((s,i)=>({s,i})).filter(x=>x.s.cat===S.cat);
    v.innerHTML = `<div class="${cls}"><h2>Size nasıl bir bakım yapalım?</h2><p class="hint">Önce kategoriyi, sonra işlemi seçin.</p>
      <div class="cats">${cats.map(c=>`<button class="cat ${c===S.cat?"sel":""}" data-c="${c}">${ICONS[c]||""}${c}</button>`).join("")}</div>
      <div class="list two">${items.map((x,k)=>`<button class="opt ${S.service===x.s?"sel":""}" style="--i:${k}" data-i="${x.i}">
        <span class="ico">${ICONS[x.s.cat]||""}</span><span class="t"><span class="name">${x.s.name}</span><span class="dur">⏱ ${durTxt(x.s.min)}</span></span><span class="check">${CHECK}</span></button>`).join("")}</div></div>`;
    v.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c; S.dir=1; render(); });
    v.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.service=CONFIG.services[b.dataset.i]; S.time=null;
      v.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o===b)); $("#next").disabled=false;
      setTimeout(()=>go(1),280);});
    const sc=v.querySelector(".cat.sel"); if(sc) sc.scrollIntoView({inline:"center",block:"nearest"});
    bar.innerHTML=`<button class="btn main" ${S.service?"":"disabled"} id="next">Devam et</button>`;
  }

  if(S.step===1){
    v.innerHTML=`<div class="${cls}"><h2>Uzmanınızı seçin</h2><p class="hint">${S.service.name} · ${durTxt(S.service.min)}</p><div class="list two">
      <button class="opt ${S.staff==="*"?"sel":""}" style="--i:0" data-s="*"><span class="avatar" style="--c1:#c29a45;--c2:#f2d896">★</span><span class="t"><span class="name">Fark etmez <span class="badge">En hızlı</span></span><span class="dur">İlk uygun uzman</span></span><span class="check">${CHECK}</span></button>
      ${CONFIG.staff.map((p,k)=>{const c=PAL[k%PAL.length];return `<button class="opt ${S.staff===p?"sel":""}" style="--i:${k+1}" data-s="${esc(p)}"><span class="avatar" style="--c1:${c[0]};--c2:${c[1]}">${esc(p[0])}</span><span class="t"><span class="name">${esc(p)}</span><span class="dur">Uzman</span></span><span class="check">${CHECK}</span></button>`}).join("")}
    </div></div>`;
    v.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.staff=b.dataset.s; S.time=null; S.date=null;
      v.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o===b)); $("#next").disabled=false;
      setTimeout(()=>go(2),280);});
    bar.innerHTML=`<button class="btn ghost" id="back">Geri</button><button class="btn main" ${S.staff?"":"disabled"} id="next">Devam et</button>`;
  }

  if(S.step===2 && !loaded){
    v.innerHTML=`<div class="${cls}"><h2>Ne zaman gelmek istersiniz?</h2><div class="empty">Boş saatler yükleniyor…</div></div>`;
    bar.innerHTML=`<button class="btn ghost" id="back">Geri</button><button class="btn main" disabled>Devam et</button>`;
    (loading||loadBusy()).then(()=>{ if(!loaded){ v.querySelector(".empty").innerHTML="Bağlantı kurulamadı. Lütfen tekrar deneyin veya bizi arayın: <a href='tel:+905303449170'>0530 344 91 70</a>"; } else render(); });
    $("#back").onclick=()=>go(1); return;
  }
  if(S.step===2){
    const today=new Date(); today.setHours(0,0,0,0); const list=[];
    for(let i=0;i<CONFIG.daysAhead;i++){const d=new Date(today); d.setDate(today.getDate()+i); list.push(d);}
    if(!S.date) S.date=list.find(d=>slotsFor(d).length)||list[0];
    const slots=slotsFor(S.date);
    const groups=[["Sabah",0,720],["Öğleden sonra",720,1020],["Akşam",1020,1440]].map(([n,a,b])=>[n,slots.filter(t=>t>=a&&t<b)]).filter(g=>g[1].length);
    let k=0;
    v.innerHTML=`<div class="${cls}"><h2>Ne zaman gelmek istersiniz?</h2><p class="hint">${S.service.name} · ${esc(staffTxt())}</p>
      <div class="days">${list.map((d,i)=>{const closed=!CONFIG.hours[d.getDay()];return `<button class="day ${ymd(d)===ymd(S.date)?"sel":""}" data-d="${i}" ${closed?"disabled":""}><small>${i===0?"Bugün":i===1?"Yarın":DAYS[d.getDay()]}</small><b>${d.getDate()}</b><small>${MONTHS[d.getMonth()]}</small></button>`}).join("")}</div>
      <div id="slots">${groups.length?groups.map(([n,ts])=>`<div class="period">${n}</div><div class="times">${ts.map(t=>`<button class="time ${S.time===t?"sel":""}" style="--i:${k++}" data-t="${t}">${toHM(t)}</button>`).join("")}</div>`).join("")
        :`<div class="empty">Bu gün için boş saat kalmadı.<br>Başka bir gün seçebilirsiniz.</div>`}</div></div>`;
    v.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.date=list[b.dataset.d]; S.time=null; S.dir=1; render();});
    v.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.time=+b.dataset.t; v.querySelectorAll(".time").forEach(o=>o.classList.toggle("sel",o===b)); $("#next").disabled=false;});
    const sel=v.querySelector(".day.sel"); if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
    bar.innerHTML=`<button class="btn ghost" id="back">Geri</button><button class="btn main" ${S.time!=null?"":"disabled"} id="next">Devam et</button>`;
  }

  if(S.step===3){
    v.innerHTML=`<div class="${cls}"><h2>Son bir adım</h2><p class="hint">Randevunuzu onaylamak için bilgilerinizi yazın.</p>
      <div class="summary">
        <div>${ICONS[S.service.cat]}<span>${S.service.name} · ${durTxt(S.service.min)}</span></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>${esc(staffTxt())}</span></div>
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>${fullDate(S.date)} · <b>${toHM(S.time)}</b></span></div>
      </div>
      <div class="field"><input id="n" autocomplete="name" placeholder=" " value="${esc(S.name)}"><label for="n">Ad Soyad</label></div>
      <div class="field"><input id="p" type="tel" inputmode="tel" autocomplete="tel" placeholder=" " value="${esc(S.phone)}"><label for="p">Telefon (WhatsApp) · 05xx xxx xx xx</label></div>
      <div class="field"><textarea id="o" rows="2" placeholder=" ">${esc(S.note)}</textarea><label for="o">Not (isteğe bağlı)</label></div>
      <div class="err" id="err"></div></div>`;
    ["n","p","o"].forEach(id=>$("#"+id).oninput=e=>{S[{n:"name",p:"phone",o:"note"}[id]]=e.target.value;});
    bar.innerHTML=`<button class="btn ghost" id="back">Geri</button><button class="btn main" id="next">Randevuyu onayla</button>`;
  }

  if(S.step===4){
    const msg=`Merhaba, online randevu aldım:\n${S.service.name}\n${fullDate(S.date)} ${toHM(S.time)} – ${S.assigned}\n${S.name}`;
    v.innerHTML=`<div class="card done panel"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg>
      <h2>Randevunuz alındı!</h2><p class="hint" style="margin:6px 0 0">Sizi görmek için sabırsızlanıyoruz ✨</p>
      <div class="ticket"><div><span>İşlem</span><b>${S.service.name}</b></div><div><span>Uzman</span><b>${esc(S.assigned)}</b></div><div><span>Tarih</span><b>${fullDate(S.date)}</b></div><div><span>Saat</span><b>${toHM(S.time)}</b></div></div>
      <p class="hint" style="margin-top:14px">Randevunuzdan bir gün önce WhatsApp'tan hatırlatma gönderilecek.</p>
      <a class="wa" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.1z"/></svg>WhatsApp'tan bize yazın</a></div>`;
    const card=v.querySelector(".done"), cols=["#c29a45","#e6c77d","#2e2e2e","#e9cfc4","#8a8a8a"];
    for(let i=0;i<34;i++){const c=document.createElement("span");c.className="confetti";c.style.left=Math.random()*100+"%";
      c.style.background=cols[i%cols.length];c.style.animationDelay=(Math.random()*.6)+"s";c.style.animationDuration=(2+Math.random()*1.4)+"s";card.appendChild(c);}
    bar.innerHTML=`<button class="btn main" id="again">Yeni randevu al</button>`;
  }

  const n=$("#next"),b=$("#back"),a=$("#again");
  if(b) b.onclick=()=>go(S.step-1);
  if(a) a.onclick=()=>{ loadBusy();Object.assign(S,{cat:null,service:null,staff:null,date:null,time:null,note:""}); go(0);};
  if(n) n.onclick=()=>{
    if(S.step===3){
      const phone=S.phone.replace(/\D/g,""), err=$("#err");
      const fail=t=>{err.textContent=t; const c=v.querySelector(".card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");};
      if(S.name.trim().length<3) return fail("Lütfen adınızı ve soyadınızı yazın.");
      if(!/^(90)?0?5\d{9}$/.test(phone)) return fail("Lütfen geçerli bir cep telefonu yazın (05xx xxx xx xx).");
      const date=ymd(S.date),end=S.time+S.service.min, pool=S.staff==="*"?CONFIG.staff:[S.staff];
      if(!API){
        const who=pool.find(p=>isFree(p,date,S.time,end));
        if(!who){S.time=null; go(2); return;}
        BOOKED.push({staff:who,date,start:S.time,end}); S.assigned=who; go(4); return;
      }
      n.disabled=true; n.textContent="Gönderiliyor…";
      fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"book",service:S.service.name,duration:S.service.min,staff:S.staff,date,start:toHM(S.time),name:S.name.trim(),phone:S.phone,note:S.note})})
        .then(r=>r.json()).then(j=>{
          if(j.ok){ S.assigned=j.staff; BOOKED.push({staff:j.staff,date,start:S.time,end}); go(4); return; }
          if(j.error==="DOLU"){ alert(j.message); S.time=null; loaded=false; loadBusy(); go(2); return; }
          fail(j.error||"Bir sorun oluştu, lütfen tekrar deneyin."); n.disabled=false; n.textContent="Randevuyu onayla";
        }).catch(()=>{ fail("Bağlantı hatası. Lütfen tekrar deneyin veya 0530 344 91 70'i arayın."); n.disabled=false; n.textContent="Randevuyu onayla"; });
      return;
    }
    go(S.step+1);
  };
}
loadBusy();
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
